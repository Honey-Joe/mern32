<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex justify-center items-center h-screen">
        <div class="flex flex-col gap-5 justify-center items-center">
            <p id="counter">0</p>
            <div class="flex gap-5">
                <button class="bg-green-500 px-5 py-2 rounded-lg" id="addBtn">+</button>
                <button class="bg-red-500 px-5 py-2 rounded-lg" id="subBtn">-</button>
                <button class="bg-blue-500 px-5 py-2 rounded-lg" id="resetBtn">reset</button>
            </div>
        </div>
    </div>
</body>
<script>
    let count = document.getElementById('counter')
    let add = document.getElementById('addBtn')
    let sub = document.getElementById('subBtn')
    let reset = document.getElementById('resetBtn')

    add.addEventListener('click' , ()=>{
        count.textContent = parseInt(count.textContent) + 1
    })

    sub.addEventListener('click' , ()=>{
        count.textContent = parseInt(count.textContent) - 1
    })

    reset.addEventListener('click' , ()=>{
        count.textContent = 0
    })

    

</script>
</html>
