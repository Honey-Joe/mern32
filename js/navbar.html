<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="max-w-[100%]">
        <div class="w-[80%] mx-auto grid grid-cols-1 lg:grid-cols-2">
            <div class="bg-red-500 flex justify-between">
                <p>Logo</p>
                <div>
                    <button id="menuBtn" class="lg:hidden "><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></button>
                    <button id="closeBtn" class="hidden lg:hidden"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                </div>
            </div>
            <div class="bg-green-500 hidden lg:block" id="navitem">
                <div class="flex justify-end gap-5 flex-col items-center lg:flex-row">
                    <p>Home</p>
                    <p>About</p>
                    <p>Contact</p>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    let menuBtn = document.getElementById('menuBtn')
    let closeBtn = document.getElementById('closeBtn')
    let navitem = document.getElementById('navitem')

    menuBtn.addEventListener('click' , ()=>{
        navitem.classList.remove('hidden')
        closeBtn.classList.remove('hidden')
        menuBtn.classList.add('hidden')
    })

    closeBtn.addEventListener('click' , ()=>{
        navitem.classList.add('hidden')
        closeBtn.classList.add('hidden')
        menuBtn.classList.remove('hidden')
    })
</script>
</html>
